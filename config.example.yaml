# ETABS Beam Generator - 配置示例
# 复制此文件为 config.yaml 并根据本地环境修改

# ============================================================================
# ETABS 连接配置
# ============================================================================
etabs:
  # ETABS 22/23 OAPI DLL 路径；必须与当前宿主主版本一致。
  # 默认示例使用 ETABS 23 x64；ETABS 22 可改为
  # E:\Program Files\Computers and Structures\ETABS 22\ETABSv1.dll
  dll_path: "E:\\Program Files\\Computers and Structures\\ETABS 23\\ETABSv1.dll"

  # 连接模式
  # "attach" - attach 到已运行的 ETABS 实例（推荐阶段1）
  # "create" - 创建新实例（后续备选）
  mode: "attach"

# ============================================================================
# 几何与拓扑配置
# ============================================================================
geometry:
  # 坐标判等容差（mm）
  # 用于判断两个梁端点是否共点（连续梁判据）
  coordinate_tolerance_mm: 1.0

  # 支承交点落在源 Object 端点内侧不超过此值时，忽略该端部微小碎片，
  # 避免把 Object 误判为跨两个 Span；真实跨越支承仍会阻塞模型改名
  source_span_overlap_tolerance_mm: 2.0

  # 梁斜率限制（度）
  # 超过此值则判为非水平梁（连续梁判据）
  slope_limit_deg: 1.0

  # 同截面梁段合并时允许的平面夹角（度）；用于折线梁
  merge_angle_limit_deg: 15.0

  # 导出固定使用的 ETABS 当前单位；运行结束后自动恢复模型原单位
  # 当前 MVP 仅接受 N_mm_C
  unit_system: "N_mm_C"

# ============================================================================
# 设计配置
# ============================================================================
design:
  # 设计规范选择
  # 当前配筋引擎仅接受 ACI 318-14；其他规范需先实现独立策略。
  standard: "ACI 318-14"

  # 可选：从混凝土表面到箍筋外缘的净保护层（mm）。
  # 提供时必须同时记录来源，配筋引擎按该显式净保护层计算。
  # 留空时，按每个截面的 ETABS GetRebarBeam CoverTop/CoverBot
  # （混凝土面至纵筋重心）控制值计算有效高度，并针对候选纵筋/箍筋
  # 反算排布净宽；若 ETABS cover 也缺失则 fail-closed。
  clear_cover_to_stirrup_outer_mm:
  clear_cover_source: ""

  # 项目最大骨料粒径（mm）及其来源。两项均留空时采用项目默认值
  # 25 mm，并记录 "Project default: 25 mm maximum aggregate size"。
  # 若由配置或后续插件菜单显式选择其他值，必须同时写入可追溯来源。
  max_aggregate_size_mm:
  max_aggregate_size_source: ""

# ============================================================================
# 输出配置
# ============================================================================
output:
  # 输出报告目录
  # 生成的梁表 Excel 文件将放在此处
  reports_dir: "build/output/reports"

  # 日志目录
  # 运行日志将保存在此处
  logs_dir: "build/output/logs"

  # 输出文件名格式
  # {timestamp} 自动替换为 YYYYMMDD_HHMMSS
  report_filename: "beam_schedule_{timestamp}.xlsx"
  log_filename: "etabs_beam_{timestamp}.log"


# ============================================================================
# 日志配置
# ============================================================================
logging:
  # 日志级别
  # DEBUG   - 详细信息（用于开发/故障排查）
  # INFO    - 一般信息（推荐生产环境）
  # WARNING - 警告信息
  # ERROR   - 错误信息
  level: "INFO"

# ============================================================================
# 高级配置（可选）
# ============================================================================
advanced:
  # [阶段2] 选梁策略
  # "all"      - 选择模型中的所有梁（默认）
  # "selected" - 仅处理当前 ETABS 选中的梁
  # "byStory"  - 按楼层分别处理
  beam_selection_mode: "all"

# ============================================================================
# 注意事项
# ============================================================================
# 1. DLL 路径：确保使用与 ETABS 22/23 宿主主版本一致的 x64 DLL
# 2. 单位：工具假设 ETABS 模型使用 "N-mm-C" 单位系统
# 3. 分析与设计：梁表导出前，模型需完成"Run Analysis"和"Start Design"
# 4. 文件权限：build/output/ 需要写入权限
# 5. 火墙：pythonnet 加载 DLL 时可能触发防火墙警告，请允许
