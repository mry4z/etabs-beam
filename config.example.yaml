# ETABS Beam Generator - 配置示例
# 复制此文件为 config.yaml 并根据本地环境修改

# ============================================================================
# ETABS 连接配置
# ============================================================================
etabs:
  # ETABS 22 OAPI DLL 路径
  # 默认安装位置（x64）
  dll_path: "E:\\Program Files\\Computers and Structures\\ETABS 22\\ETABSv1.dll"

  # API 版本（必须与 DLL 版本匹配）
  api_version: "22"

  # 连接超时时间（秒）
  timeout_sec: 30

  # 连接模式
  # "attach" - attach 到已运行的 ETABS 实例（推荐阶段1）
  # "create" - 创建新实例（后续备选）
  mode: "attach"

# ============================================================================
# 几何与拓扑配置
# ============================================================================
geometry:
  # 坐标判等容差（mm）
  # 用于判断两个梁端点是否共点（连续梁判据）
  coordinate_tolerance_mm: 1.0

  # 梁斜率限制（度）
  # 超过此值则判为非水平梁（连续梁判据）
  slope_limit_deg: 1.0

  # 导出固定使用的 ETABS 当前单位；运行结束后自动恢复模型原单位
  # 当前 MVP 仅接受 N_mm_C
  unit_system: "N_mm_C"

# ============================================================================
# 设计配置
# ============================================================================
design:
  # 设计规范选择
  # "ACI318-19" - 美国 ACI 318-19（阶段1 读 ETABS 设计结果）
  # "GB50010"   - 中国 GB 50010-2010（远景，自研实现）
  standard: "ACI318-19"

  # 阶段1：读取 ETABS 设计结果（无需自研公式）
  # 若模型未完成分析+设计，工具会提示用户先在 ETABS 内完成
  read_etabs_results: true

  # [远景] 自研配筋参数示例（暂未启用）
  # aci318:
  #   concrete_grade: "C30"
  #   rebar_type: "HRB400"
  #   cover_mm: 40

# ============================================================================
# 输出配置
# ============================================================================
output:
  # Excel 模板路径（相对于项目根目录）
  # 包含预设格式、列标题、公式等
  excel_template: "assets/templates/beam_schedule_template.xlsx"

  # 输出报告目录
  # 生成的梁表 Excel 文件将放在此处
  reports_dir: "build/output/reports"

  # 日志目录
  # 运行日志将保存在此处
  logs_dir: "build/output/logs"

  # 输出文件名格式
  # {timestamp} 自动替换为 YYYYMMDD_HHMMSS
  report_filename: "beam_schedule_{timestamp}.xlsx"
  log_filename: "etabs_beam_{timestamp}.log"

  # 文件被占用时是否覆盖或使用时间戳规避
  # "overwrite" - 直接覆盖（不推荐）
  # "timestamp" - 添加序号或时间戳规避（推荐）
  if_exists: "timestamp"

# ============================================================================
# 日志配置
# ============================================================================
logging:
  # 日志级别
  # DEBUG   - 详细信息（用于开发/故障排查）
  # INFO    - 一般信息（推荐生产环境）
  # WARNING - 警告信息
  # ERROR   - 错误信息
  level: "INFO"

  # 日志格式
  # %(asctime)s   - 时间戳
  # %(name)s      - 模块名称
  # %(levelname)s - 日志级别
  # %(message)s   - 日志消息
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # 日期格式（strftime）
  date_format: "%Y-%m-%d %H:%M:%S"

# ============================================================================
# 高级配置（可选）
# ============================================================================
advanced:
  # [阶段2] 选梁策略
  # "all"      - 选择模型中的所有梁（默认）
  # "selected" - 仅处理当前 ETABS 选中的梁
  # "byStory"  - 按楼层分别处理
  beam_selection_mode: "all"

  # [阶段3] 连续梁链分析
  # 是否启用连续梁的支座反力计算（需要完成分析）
  include_support_reactions: true

  # [阶段4] 设计结果处理
  # 若模型未完成设计，是否自动启用 ETABS 设计流程
  auto_run_design: false

  # [调试] 是否生成详细的调试日志
  debug_mode: false

  # [调试] 是否保留临时文件
  keep_temp_files: false

# ============================================================================
# 注意事项
# ============================================================================
# 1. DLL 路径：确保使用 ETABS 22 x64 版本
# 2. 单位：工具假设 ETABS 模型使用 "N-mm-C" 单位系统
# 3. 分析与设计：梁表导出前，模型需完成"Run Analysis"和"Start Design"
# 4. 文件权限：build/output/ 需要写入权限
# 5. 火墙：pythonnet 加载 DLL 时可能触发防火墙警告，请允许
